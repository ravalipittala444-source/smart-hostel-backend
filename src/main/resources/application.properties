spring.application.name=Smart_Hostel

# ── DataSource ──────────────────────────────────────────────────────────────
# Set environment variables DB_URL, DB_USERNAME, DB_PASSWORD before running.
# PowerShell: $env:DB_URL="jdbc:mysql://localhost:3306/smart_hostel?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata"
#             $env:DB_USERNAME="root"
#             $env:DB_PASSWORD="root"
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_hostel?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ── Server ───────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.org.springframework.security=WARN
logging.level.com.example=INFO

# ── JWT Security ─────────────────────────────────────────────────────────────
# Secret key must be at least 256 bits (32 bytes) for HMAC-SHA256
jwt.secret=${JWT_SECRET:smart_hostel_super_secure_jwt_secret_key_2026_hostel_management_must_be_at_least_256_bits_long}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── Admin Bootstrap ──────────────────────────────────────────────────────────
# Provision initial administrator on startup if no admin account exists
admin.email=${ADMIN_EMAIL:admin@smarthostel.edu}
admin.password=${ADMIN_PASSWORD:Admin@Hostel2026!}
admin.name=${ADMIN_NAME:System Administrator}
admin.phone=${ADMIN_PHONE:9876543210}

# ── CORS Configuration ──────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://smart-hostel-frontend-beige.vercel.app,http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
